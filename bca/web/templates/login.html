{% extends "base.html" %}
{% block content %}
<section class="wrap narrow section">
  <h1>Log in</h1>
  <p class="lede">Enter the email you used at checkout. We'll send you a one-time login link, so there's no password to remember.</p>
  <form method="post" action="/login" class="card form">
    <label>Email<input type="email" name="email" required autocomplete="email"></label>
    <button class="btn primary">Email me a link</button>
  </form>
</section>
{% endblock %}
