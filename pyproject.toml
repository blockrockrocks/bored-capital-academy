[project]
name = "bored-capital-academy"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "openpyxl>=3.1", "anthropic>=2.5"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bca = "bca.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bca"]
