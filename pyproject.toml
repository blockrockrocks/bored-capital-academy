[project]
name = "bored-capital-academy"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "openpyxl>=3.1", "anthropic>=2.5", "fastapi>=0.115", "uvicorn>=0.30", "jinja2>=3.1", "python-multipart>=0.0.9", "markdown>=3.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]


[project.scripts]
bca = "bca.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bca", "bca.web"]

[tool.setuptools.package-data]
"bca.web" = ["templates/*.html", "static/*"]
